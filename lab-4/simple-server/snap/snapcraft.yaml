name: simple-server
base: core26
version: '0.1'
summary: A simple ncat-based TCP server
description: |
  A minimal TCP server snap built for the Snapcraft 101 course.

grade: devel
confinement: strict

layout:
  /etc/simple-server:
    symlink: $SNAP/static/content

plugs:
  server-content:
    interface: content
    content: server-content
    target: $SNAP/static

parts:
  packages:
    plugin: nil
    stage-packages:
      - ncat
  scripts:
    plugin: dump
    source: ./scripts
    organize:
      simple-server.sh: bin/simple-server.sh

apps:
  simple-server:
    command: bin/simple-server.sh
    plugs:
      - network-bind
      - server-content
