name: simple-server # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: A simple ncat-based TCP server # 79 char long summary
description: |
  A minimal TCP server snap build for the snapcraft 101 course.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

layout:
  /etc/simple-server:
    symlink: $SNAP/static/content

plugs:
  server-content:
    interface: content
    content: server-content
    target: $SNAP/static

adopt-info: scripts

parts:
  packages:
    after: [scripts]
    plugin: nil
    stage-packages:
      - ncat
    override-build: |
      my_version="$(craftctl get version)"
      craftctl default
    stage:
      - -etc
      - -usr/lib/x86_64-linux-gnu/liblua5.4-c++*
      - -usr/sbin
      - -usr/share/doc
      - -usr/share/lintian
      - -usr/share/man
      - -usr/share/perl5
      - -var
  scripts:
    plugin: dump
    source: ./scripts
    build-packages:
      - git
    organize:
      '*': bin/
    override-pull: |
      craftctl default
    override-build: |
      craftctl default
      version="$(
        cd "${CRAFT_PROJECT_DIR}"
        git describe --tag --dirty
      )"
      craftctl set version="${version}"
apps:
  simple-server:
    command: bin/simple-server.sh
    daemon: simple
    restart-condition: on-failure
    plugs:
      - network-bind
      - server-content
